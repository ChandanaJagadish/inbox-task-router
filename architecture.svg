<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#ffffff"/>

  <text x="450" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Inbox-to-Task Router — Architecture</text>

  <!-- Gmail box -->
  <rect x="340" y="64" width="220" height="60" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="450" y="99" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0c4a6e">Gmail Inbox</text>

  <!-- arrow down to agent -->
  <line x1="450" y1="124" x2="450" y2="164" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="465" y="150" font-family="Arial, sans-serif" font-size="12" fill="#64748b">poll (every 15 min)</text>

  <!-- Agent box -->
  <rect x="300" y="168" width="300" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="450" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#78350f">Agent (agent_once.py)</text>
  <text x="450" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#78350f">runs via GitHub Actions schedule</text>

  <!-- arrow down to gemini -->
  <line x1="450" y1="238" x2="450" y2="278" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="465" y="264" font-family="Arial, sans-serif" font-size="12" fill="#64748b">classify intent</text>

  <!-- Gemini box -->
  <rect x="300" y="282" width="300" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="450" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4c1d95">Gemini 3.5 Flash</text>

  <!-- split arrows -->
  <line x1="450" y1="342" x2="450" y2="368" stroke="#475569" stroke-width="2"/>
  <line x1="450" y1="368" x2="220" y2="368" stroke="#475569" stroke-width="2"/>
  <line x1="450" y1="368" x2="680" y2="368" stroke="#475569" stroke-width="2"/>
  <line x1="220" y1="368" x2="220" y2="400" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="368" x2="680" y2="400" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="220" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#166534">freelance_inquiry</text>
  <text x="680" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">bug_report</text>

  <!-- Freelance branch -->
  <rect x="80" y="404" width="280" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="220" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#14532d">Draft proposal reply</text>
  <text x="220" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#14532d">saved via Gmail Drafts API</text>

  <!-- Bug branch -->
  <rect x="540" y="404" width="280" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="680" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7f1d1d">Create GitHub issue</text>
  <text x="680" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f1d1d">via GitHub REST API</text>

  <!-- merge down -->
  <line x1="220" y1="464" x2="220" y2="490" stroke="#475569" stroke-width="2"/>
  <line x1="680" y1="464" x2="680" y2="490" stroke="#475569" stroke-width="2"/>
  <line x1="220" y1="490" x2="680" y2="490" stroke="#475569" stroke-width="2"/>
  <line x1="450" y1="490" x2="450" y2="510" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Label handled box -->
  <rect x="320" y="514" width="260" height="40" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="450" y="539" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1e293b">Label email: agent-handled</text>
</svg>
